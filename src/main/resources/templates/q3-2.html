<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
    <div th:each="e : ${list}">
        <div th:if="${num} % 2 == 0">
            <div th:if="${e.id % 2 == 0}" 
                 th:text="${e.id + ', ' + e.name}">
            </div>
        </div>
        <div th:unless="${num} % 2 == 0">
            <div th:unless="${e.id % 2 == 0}" 
                 th:text="${e.id + ', ' + e.name}">
            </div>
        </div>
    </div>
</body>
</html>
