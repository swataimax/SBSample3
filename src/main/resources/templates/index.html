<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>条件分岐、多項分岐、繰り返し</title>
</head>
<body>
    <div>
        <div>条件分岐</div>
        <p th:if="${num} > 0">th:ifを表示</p>
        <p th:unless="${num} > 0">th:unlessを表示</p>
    </div>
    <hr>
    <div>
        <div>多項分岐</div>
        <div th:switch="${num}">
            <p th:case="0" th:text="${num} + ' … case:0'"></p>
            <p th:case="1" th:text="${num} + ' … case:1'"></p>
            <p th:case="*" th:text="${num} + ' … case:*'"></p>
        </div>
    </div>
    <hr>
    <div>
        <div>繰り返し</div>
        <div th:each="e : ${list}">
            <p th:text="${e.id} + ', ' + ${e.name}"></p>
        </div>
    </div>
</body>
</html>
